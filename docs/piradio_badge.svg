  <rect x="28" y="28" width="744" height="744" fill="#0b3d31" stroke="#ffff00" stroke-width="18"/>
  <rect x="70" y="70" width="660" height="660" fill="#000000" stroke="#00ff66" stroke-width="8"/>
  <g stroke="#00ff66" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round">
