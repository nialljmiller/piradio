<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Pi Radio badge</title>
  <desc id="desc">A retro web badge for Pi Radio with a radio tower and green screen text.</desc>
